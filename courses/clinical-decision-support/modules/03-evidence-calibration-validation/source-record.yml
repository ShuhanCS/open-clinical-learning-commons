claim_limits:
  - The cohort is a teaching construct and not a complete clinical screening policy.
  - One HbA1c value at or above 6.5 percent is not a diagnosis or confirmed disease.
  - NHANES does not establish local prevalence, prospective validity, workflow fit, utility, safety, fairness, or benefit.
  - The 2021-2023 release is a separate transport stress test and is not pooled with earlier cycles.
  - The bootstrap is a teaching sensitivity method pending formal complex-survey review.
  - No candidate threshold is clinically selected or accepted.
  - No artifact authorizes real-patient scoring, clinical alerting, implementation, or deployment.
