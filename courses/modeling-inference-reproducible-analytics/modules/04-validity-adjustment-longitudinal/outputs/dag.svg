100" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="590" y1="100" x2="750" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="430" y1="180" x2="750" y2="180" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="80" y1="80" x2="430" y2="320" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><line x1="80" y1="280" x2="430" y2="320" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><g><circle cx="80" cy="80" r="34" fill="#e0f2fe" stroke="#1f49b6" stroke-width="2"/><text x="80" y="85" text-anchor="middle" font-size="14">A</text></g><g><circle cx="250" cy="140" r="34" fill="#e0f2fe" stroke="#1f49b6" stroke-width="2"/><text x="250" y="145" text-anchor="middle" font-size="14">S</text></g><g><circle cx="80" cy="180" r="34" fill="#e0f2fe" stroke="#1f49b6" stroke-width="2"/><text x="80" y="185" text-anchor="middle" font-size="14">C</text></g><g><circle cx="80" cy="280" r="34" fill="#e0f2fe" stroke="#1f49b6" stroke-width="2"/><text x="80" y="285" text-anchor="middle" font-size="14">H</text></g><g><circle cx="250" cy="300" r="34" fill="#e0f2fe" stroke="#1f49b6" stroke-width="2"/><text x="250" y="305" text-anchor="middle" font-size="14">U</text></g><g><circle cx="430" cy="180" r="34" fill="#e0f2fe" stroke="#1f49b6" stroke-width="2"/><text x="430" y="185" text-anchor="middle" font-size="14">T</text></g><g><circle cx="590" cy="100" r="34" fill="#e0f2fe" stroke="#1f49b6" stroke-width="2"/><text x="590" y="105" text-anchor="middle" font-size="14">M</text></g><g><circle cx="750" cy="180" r="34" fill="#e0f2fe" stroke="#1f49b6" stroke-width="2"/><text x="750" y="185" text-anchor="middle" font-size="14">Y</text></g><g><circle cx="430" cy="320" r="34" fill="#e0f2fe" stroke="#1f49b6" stroke-width="2"/><text x="430" y="325" text-anchor="middle" font-size="14">R</text></g><text x="20" y="390" font-size="14">A age; C comorbidity; H site; S severity; U preference; T treatment; M mediator; Y outcome; R comp