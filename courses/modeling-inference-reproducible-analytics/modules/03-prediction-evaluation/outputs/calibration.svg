<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400" role="img" aria-labelledby="title desc"><title id="title">Test calibration teaching groups</title><desc id="desc">Five 15-row groups compare mean predicted probability with observed outcome proportion. Exact values are in calibration-table.csv. Four outcomes make this display imprecise.</desc><rect width="640" height="400" fill="white"/><line x1="60" y1="340" x2="560" y2="60" stroke="#777" stroke-dasharray="6 6"/><polyline points="95.33,340.00 98.46,302.67 100.17,340.00 105.18,321.33 132.26,321.33" fill="none" stroke="#1f49b6" stroke-width="3"/><g fill="#1f49b6"><circle cx="95.33" cy="340.00" r="6"/><circle cx="98.46" cy="302.67" r="6"/><circle cx="100.17" cy="340.00" r="6"/><circle cx="105.18" cy="321.33" r="6"/><circle cx="132.26" cy="321.33" r="6"/></g><text x="260" y="385" font-size="16">Mean predicted probability</text><text x="18" y="220" font-size="16" transform="rotate(-90 18 220)">Observed proportion</text></svg>
