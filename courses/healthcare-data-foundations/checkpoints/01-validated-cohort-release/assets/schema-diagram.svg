<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">Core FND-1 relational schema</title>
  <desc id="desc">Patients connect to encounters, observations, conditions, medications, procedures, and payer transitions. Encounters connect clinical event rows to organizations, providers, and payers. The full editable relationship model and text description accompany this diagram.</desc>
  <rect width="1000" height="680" fill="#ffffff"/>
  <g stroke="#334155" stroke-width="2" fill="none">
    <path d="M220 115 L420 115"/><path d="M570 115 L780 115"/>
    <path d="M495 160 L495 260"/><path d="M495 330 L495 430"/>
    <path d="M420 295 L220 235"/><path d="M420 295 L220 355"/><path d="M570 295 L780 235"/><path d="M570 295 L780 355"/>
    <path d="M845 160 L845 210"/><path d="M845 380 L845 430"/>
  </g>
  <g fill="#eff6ff" stroke="#1f49b6" stroke-width="2">
    <rect x="70" y="70" width="150" height="90" rx="8"/><rect x="420" y="70" width="150" height="90" rx="8"/>
    <rect x="780" y="70" width="150" height="90" rx="8"/><rect x="420" y="260" width="150" height="70" rx="8"/>
    <rect x="70" y="200" width="150" height="70" rx="8"/><rect x="70" y="320" width="150" height="70" rx="8"/>
    <rect x="780" y="200" width="150" height="70" rx="8"/><rect x="780" y="320" width="150" height="70" rx="8"/>
    <rect x="420" y="430" width="150" height="70" rx="8"/><rect x="780" y="430" width="150" height="70" rx="8"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="18" fill="#0f172a" text-anchor="middle">
    <text x="145" y="105">Organizations</text><text x="145" y="132" font-size="14">one organization</text>
    <text x="495" y="105">Providers</text><text x="495" y="132" font-size="14">one provider</text>
    <text x="855" y="105">Payers</text><text x="855" y="132" font-size="14">one payer</text>
    <text x="495" y="303">Encounters</text><text x="145" y="243">Patients</text><text x="145" y="363">Observations</text>
    <text x="855" y="243">Conditions</text><text x="855" y="363">Medications</text>
    <text x="495" y="473">Other clinical events</text><text x="855" y="473">Payer transitions</text>
  </g>
  <text x="500" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#334155">See data-model.mmd and schema-description.md for all 16 tables, keys, cardinality, and optionality.</text>
</svg>
