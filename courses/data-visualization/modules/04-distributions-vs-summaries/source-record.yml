teaching_use: "Use a public hospital-level median to anchor the time scale, then use explicitly synthetic encounters to teach why a valid center can hide tails, modes, subgroups, and opposing care processes."
limits:
  - "CMS OP_18b is a hospital-level reported median, not a patient-level distribution or national patient median."
  - "The synthetic encounters are not sampled from, fitted to, or representative of a hospital or patient population."
  - "Only the discharged center is calibrated to the public release. Tails, trends, boarding, admissions, acuity, and age are not CMS estimates."
  - "The case does not establish intervention effects, patient harm, staffing need, capacity need, or a performance benchmark."
  - "Unavailable CMS values and footnotes remain in the calibration extract and must not be silently imputed."
