known_limits:
  - "The CMS score is risk standardized and is not a raw observed proportion."
  - "The release labels interval endpoints Lower Estimate and Higher Estimate; this package does not invent a confidence level."
  - "CMS comparison categories use the national rate, not every hospital pair."
  - "Displayed interval overlap is descriptive and is not a pairwise hypothesis test."
  - "The national summary too-few count is preserved as published and is not forced to equal a reconstructed hospital display category."
  - "Public aggregate data lag current hospital operations and do not establish causal care quality differences."
  - "Suppressed values must remain blank and may not be reconstructed."
