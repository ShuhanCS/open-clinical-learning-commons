known_limits:
  - "PLACES values are model-based small-area estimates rather than direct county survey estimates."
  - "The 2022 health measure and 2026 HPSA snapshot are not contemporaneous."
  - "HPSA score is attached to designation components, not to the county as a whole."
  - "The score-20 screen and twelve-county list are declared teaching rules, not official thresholds or validated allocation rules."
  - "Generalized county boundaries do not represent travel time, referral patterns, service areas, or community identity."
  - "County aggregates conceal within-county differences, local assets, readiness, trust, cost, transportation, and language access."
