known_limits:
  - "PLACES estimates use multilevel regression and poststratification rather than direct county survey estimates."
  - "The selected measures include self-reported behavior, diagnosis, height, weight, and health status."
  - "Age-adjusted estimates support comparison and do not represent outreach volume."
  - "Confidence-interval overlap is not used as a formal county-versus-national or county-versus-county test."
  - "County aggregates do not show within-county groups, access, readiness, cost, or community priorities."
  - "The profile count and order are transparent teaching devices, not validated risk, equity, clinical, or funding scores."
