<svg xmlns="http://www.w3.org/2000/svg" role="img" width="1080" height="540" viewBox="0 0 1080 540">
<title>Sensitivity of wait improvement to five conditions</title>
<desc>Median paired arrival-to-clinician wait improvement for three options under lower, point, upper, slower-service, and weak-workflow-effect conditions.</desc>
<rect width="100%" height="100%" fill="#ffffff" />
<text x="540" y="36" text-anchor="middle" font-size="23" font-weight="bold">Wait improvement changes when assumptions change</text>
<line x1="110" y1="108.1" x2="960" y2="108.1" stroke="#1f2937" />
<line x1="110" y1="80" x2="110" y2="440" stroke="#1f2937" />
<polyline points="110.0,103.1 322.5,100.6 535.0,98.0 747.5,80.0 960.0,101.8" fill="none" stroke="#0d67ff" stroke-width="3" />
<text x="975" y="110" font-size="14" fill="#0d67ff">S01 Flex clinician coverage</text>
<polyline points="110.0,119.6 322.5,130.3 535.0,176.1 747.5,440.0 960.0,138.7" fill="none" stroke="#0f766e" stroke-width="3" />
<text x="975" y="135" font-size="14" fill="#0f766e">S02 Fast-track activation</text>
<polyline points="110.0,107.7 322.5,106.9 535.0,106.1 747.5,102.9 960.0,108.1" fill="none" stroke="#d97706" stroke-width="3" />
<text x="975" y="160" font-size="14" fill="#d97706">S03 Combined bounded rule</text>
<text x="110.0" y="470" text-anchor="middle" font-size="13">C01</text>
<text x="322.5" y="470" text-anchor="middle" font-size="13">C02</text>
<text x="535.0" y="470" text-anchor="middle" font-size="13">C03</text>
<text x="747.5" y="470" text-anchor="middle" font-size="13">C04</text>
<text x="960.0" y="470" text-anchor="middle" font-size="13">C05</text>
<text x="540" y="510" text-anchor="middle" font-size="13">Positive values favor the option. A changed or failed result must remain visible.</text>
</svg>
